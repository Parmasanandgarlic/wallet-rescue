name: Security Lockfile Refresh
on:
  push:
    branches: [agent/security-remove-public-private-keys]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/security-remove-public-private-keys}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit
      - continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Parse tracked JavaScript rescue tools
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(git ls-files -z '*.js')
      - run: npm audit --omit=dev --audit-level=high
      - name: Commit verified lockfile only
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'security-lockfile-bot'
          git config user.email 'security-lockfile-bot@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'security: refresh patched dependency lockfile'
          git push origin HEAD:agent/security-remove-public-private-keys
